plugins {
    id 'application'
}

dependencies {
    implementation project(':crypto-common')
}

application {
    mainClass = 'co.icesi.crypto.worker.WorkerMain'
}

task runWorker(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'co.icesi.crypto.worker.WorkerMain'
    standardInput = System.in
}
